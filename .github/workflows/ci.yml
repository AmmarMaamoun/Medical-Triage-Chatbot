name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGION: europe-west1
  REPOSITORY: triage-repo
  SERVICE: triage-chatbot

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -v

  # Secrets can't be referenced in a job-level `if`, so this job checks for
  # them and exposes the result. Without GCP secrets, deploy is skipped and
  # the workflow still passes.
  deploy-gate:
    name: Check deploy config
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          if [ -n "$GCP_PROJECT_ID" ] && { [ -n "$GCP_SA_KEY" ] || [ -n "$GCP_WIF_PROVIDER" ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP secrets not configured — skipping Cloud Run deploy."
          fi

  deploy:
    name: Build, push & deploy to Cloud Run
    needs: [test, deploy-gate]
    if: needs.deploy-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for Workload Identity Federation
    env:
      IMAGE: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/triage-repo/triage-chatbot
      # The secrets context isn't allowed in step `if`s, so expose a flag via env.
      USE_WIF: ${{ secrets.GCP_WIF_PROVIDER != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: env.USE_WIF == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (service account key)
        if: env.USE_WIF != 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        run: docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .

      - name: Push image
        run: |
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --image "$IMAGE:${GITHUB_SHA}" \
            --platform managed --region "$REGION" \
            --allow-unauthenticated --memory=4Gi --timeout=15m
